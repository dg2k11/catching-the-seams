# Configuration for Catching the Seams (Stanford CS221 Autumn 2026)

seed: 221

paths:
  parquet_dir: "/tmp/defactify_parquet"
  processed_dir: "data/processed"
  checkpoint_dir: "checkpoints"
  output_dir: "outputs"

dataset:
  hf_repo: "Rajarshi-Roy-research/Defactify_Text_Dataset"
  arxiv_id: "2510.22874"
  min_sentences: 6
  max_sentences: 16
  min_words: 150
  max_words: 400
  train_slice_h: 210
  train_per_k: 105
  eval_slice_h: 45
  eval_per_k: 22
  edit_rates: [0, 25, 50, 75]

features:
  reference_lm: "ReferenceBigramLM"
  num_line_features: 18
  num_seam_features: 5
  state_dim: 32

mdp:
  actions: ["Human", "AI"]
  step_reward_correct: 1.0
  step_reward_incorrect: -1.0
  terminal_bonus_scale: 2.0
  discount_candidates: [0.9, 1.0]

baselines:
  b3_lr: 0.06
  b3_epochs: 40
  b3_l2: 0.001

training:
  num_epochs: 30
  learning_rate: 0.006
  l2: 0.0001
  epsilon_start: 0.30
  epsilon_end: 0.05
