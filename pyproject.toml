[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seam-detector"
version = "0.1.0"
description = "Catching the Seams: Explainable Line-Level AI Text Detection with Q-Learning (Stanford CS221 Autumn 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Deepti Gupta", email = "dg2k11@gmail.com" },
    { name = "Lingyin Wu" },
    { name = "Rohith Pamulasai" },
    { name = "Aditya Anand Bangalore" },
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "datasets>=2.19",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7",
    "torch>=2.2",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
