[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seam-detector"
version = "0.1.0"
description = "Line-level AI text detection using sequential seam features and linear Q-learning (Stanford CS221 Autumn 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Deepti Gupta", email = "dg2k11@gmail.com" },
    { name = "Lingyin Wu" },
    { name = "Rohith Pamulasai" },
    { name = "Aditya Anand Bangalore" },
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7",
    "torch>=2.2",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
